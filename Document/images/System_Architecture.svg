<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="480" viewBox="0 0 1360 480" role="img" aria-labelledby="title description">
  <title id="title">Fall detection system architecture</title>
  <desc id="description">Camera and sensor data pass through FastAPI, MediaPipe Pose, and a three-class LSTM before reaching the dashboard, database, and notification services.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
      .both { fill: none; stroke: #64748b; stroke-width: 1.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .return { fill: none; stroke: #94a3b8; stroke-width: 1.25; stroke-dasharray: 5 6; marker-start: url(#arrow); marker-end: url(#arrow); }
      .group { fill: #94a3b8; font: 600 12px Inter, "Segoe UI", sans-serif; letter-spacing: 1.8px; }
      .title { fill: #0f172a; font: 600 17px Inter, "Segoe UI", sans-serif; }
      .detail { fill: #64748b; font: 400 13px Inter, "Segoe UI", sans-serif; }
      .label { fill: #64748b; font: 500 12px Inter, "Segoe UI", sans-serif; }

      @media (prefers-color-scheme: dark) {
        .node { fill: #0d1117; stroke: #475569; }
        .title { fill: #f1f5f9; }
        .detail, .label, .group { fill: #94a3b8; }
        .line, .both, .return { stroke: #94a3b8; }
      }
    </style>
  </defs>

  <text class="group" x="145" y="55" text-anchor="middle">INPUTS</text>
  <text class="group" x="425" y="55" text-anchor="middle">API</text>
  <text class="group" x="685" y="55" text-anchor="middle">POSE EXTRACTION</text>
  <text class="group" x="945" y="55" text-anchor="middle">MODEL</text>
  <text class="group" x="1215" y="55" text-anchor="middle">APPLICATION</text>

  <rect class="node" x="40" y="90" width="210" height="84" rx="12"/>
  <text class="title" x="64" y="124">Camera stream</text>
  <text class="detail" x="64" y="149">ESP32-CAM / video / webcam</text>

  <rect class="node" x="40" y="250" width="210" height="84" rx="12"/>
  <text class="title" x="64" y="284">Sensor readings</text>
  <text class="detail" x="64" y="309">Temperature / gas / CO</text>

  <rect class="node" x="330" y="170" width="190" height="90" rx="12"/>
  <text class="title" x="354" y="207">FastAPI</text>
  <text class="detail" x="354" y="233">REST + WebSocket</text>

  <rect class="node" x="590" y="170" width="190" height="90" rx="12"/>
  <text class="title" x="614" y="207">MediaPipe Pose</text>
  <text class="detail" x="614" y="233">26 X/Y features</text>

  <rect class="node" x="850" y="170" width="190" height="90" rx="12"/>
  <text class="title" x="874" y="207">Three-class LSTM</text>
  <text class="detail" x="874" y="233">Safe / Warning / Fall</text>

  <rect class="node" x="1110" y="170" width="210" height="90" rx="12"/>
  <text class="title" x="1134" y="207">React dashboard</text>
  <text class="detail" x="1134" y="233">Live monitoring</text>

  <text class="group" x="425" y="326" text-anchor="middle">DATABASE</text>
  <text class="group" x="945" y="326" text-anchor="middle">NOTIFICATIONS</text>

  <rect class="node" x="330" y="350" width="190" height="78" rx="12"/>
  <text class="title" x="354" y="383">MongoDB</text>
  <text class="detail" x="354" y="407">Persistent data</text>

  <rect class="node" x="850" y="350" width="190" height="78" rx="12"/>
  <text class="title" x="874" y="383">Fall notifications</text>
  <text class="detail" x="874" y="407">Discord / LINE Notify</text>

  <path class="line" d="M250 132 H290 V205 H330"/>
  <text class="label" x="264" y="121">video</text>

  <path class="line" d="M250 292 H290 V225 H330"/>
  <text class="label" x="259" y="311">REST</text>

  <path class="line" d="M520 215 H590"/>
  <text class="label" x="555" y="201" text-anchor="middle">frames</text>

  <path class="line" d="M780 215 H850"/>
  <text class="label" x="815" y="201" text-anchor="middle">features</text>

  <path class="line" d="M1040 215 H1110"/>
  <text class="label" x="1075" y="201" text-anchor="middle">prediction</text>

  <path class="return" d="M425 170 V82 H1215 V170"/>
  <text class="label" x="820" y="72" text-anchor="middle">REST / WebSocket</text>

  <path class="both" d="M425 260 V350"/>
  <text class="label" x="442" y="307">read / write</text>

  <path class="line" d="M475 260 V292 H945 V350"/>
  <text class="label" x="710" y="282" text-anchor="middle">notify</text>
</svg>
